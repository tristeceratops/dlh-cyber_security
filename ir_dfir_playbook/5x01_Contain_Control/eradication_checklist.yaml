  - id: ERAD-011
    category: krbtgt
    target_host: domain
    description: Assess compromised Kerberos trust material and determine whether a double reset of krbtgt is required
    command_or_action: Validate evidence of forged-ticket or Pass-the-Ticket activity; if compromise of krbtgt keys is confirmed, coordinate two krbtgt password resets with full AD replication and the required interval between resets
    rationale: Kerberos trust material is identified as compromised; a double reset is warranted if krbtgt key compromise or forged-ticket activity is confirmed. Validate the observed attack evidence before executing this domain-wide change.
    verification_command: Review domain controller replication health and password-reset audit events; inspect Kerberos authentication telemetry and incident timestamps
    expected_verification_result: Decision and evidence are documented; if reset is approved and completed, both rotations and replication are confirmed across domain controllers
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-012
    category: network
    target_host: perimeter
    description: Block outbound communications to both identified C2 IPs
    command_or_action: Apply and deploy firewall egress deny rules for 185.220.101.47 and 91.234.99.107 across applicable egress points
    verification_command: Review firewall policy and deny logs; query NetFlow or packet telemetry for traffic to 185.220.101.47 and 91.234.99.107 after rule deployment
    expected_verification_result: Both deny rules are active; no successful outbound C2 sessions are observed after deployment, with telemetry coverage and query interval documented
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-013
    category: network
    target_host: perimeter
    description: Verify internal segmentation prevents lateral movement between affected hosts and restricted network segments
    command_or_action: Apply approved segmentation rules limiting affected-host communication to explicitly authorized incident-response and remediation services
    verification_command: Review deployed ACL or firewall policy; run approved connectivity tests and inspect corresponding firewall logs
    expected_verification_result: Unauthorized inter-host and restricted-segment connections are denied; required remediation and IR jumpbox connectivity remains available
    status: pending
    executed_at: null
    executed_by: null
