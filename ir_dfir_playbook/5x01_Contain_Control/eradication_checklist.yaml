
items:
  - id: ERAD-001
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove identified dropped files X and X.exe after evidence preservation
    command_or_action: Remove-Item -LiteralPath '<confirmed_path_X>','<confirmed_path_X.exe>' -Force
    verification_command: Test-Path '<confirmed_path_X>'; Test-Path '<confirmed_path_X.exe>'; endpoint live-response file listing
    expected_verification_result: Both paths return False and endpoint live-response returns no matching files
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-002
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove confirmed scheduled task persistence associated with the incident
    command_or_action: schtasks /delete /tn '<confirmed_task_name_or_GUID>' /f
    verification_command: schtasks /query /fo LIST /v | findstr /i '<confirmed_task_name_or_GUID>'
    expected_verification_result: No matching scheduled task remains
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-003
    category: malware_artifact
    target_host: WST-WS-031
    description: Remove confirmed registry persistence associated with the incident
    command_or_action: Export the confirmed registry key for evidence preservation, then remove only the validated malicious value or key
    verification_command: Query the confirmed registry path and value; inspect endpoint live-response registry results
    expected_verification_result: Confirmed malicious persistence value or key is absent and evidence export is retained
    status: pending
    executed_at: null
    executed_by: null

  - id: ERAD-004
    category: process
    target_host: WST-WS-031
    description: Identify and terminate attacker-associated PowerShell PID 7812 and MSBuild PID 8104 after volatile evidence collection
    command_or_action: Capture process memory and metadata where feasible; validate current PID-to-process mapping, then terminate confirmed malicious processes using approved endpoint response
    verification_command: Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -in @(7812,8104) } | Select-Object ProcessId,Name,CommandLine
    expected_verification_result: No confirmed malicious process remains running; PID reuse is ruled out and evidence references are recorded
    status: pending
    executed_at: null
    executed_by: null

