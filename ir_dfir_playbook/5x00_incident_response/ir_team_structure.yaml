roles:
  IR_Commander: 
    primary: James Chen, SOC Lead
    backup: Sarah Park, IT Director
    responsibilities:
      - Owns the incident through closure
      - Runs the incident bridge and timeline
      - Authorizes containment actions within authority ceiling
    authority_ceiling: SEV2
  Technical_Lead:
    primary: Robert Kim, Infrastructure Lead
    backup: Mike Torres, Network Engineer
    responsibilities:
      - Coordinates the technical teams (IT, Network, etc)
      - Proposes and implements containment, eradication, and recovery measures
      - Inform IR Commander of the evolving situation
    authority_ceiling: SEV2
  Communications_Lead:
    primary: Marcus Webb, Communications Director
    backup: Sarah Park, IT Director
    responsibilities:
      - Prepare communication plan for collaborators, clients, partners or medias
      - Coordinates public communication with technical, law and lead teams
      - Deny fake or wrong informations
    authority_ceiling: SEV2
  Legal_Liaison:
    primary: Helena Reyes, General Counsel
    backup: Dr. Patricia Morales, CISO
    responsibilities:
      - Assess the legal consequences of the incident
      - Ensure the proper preservation of evidence for potential proceedings
      - Assesses the organization's contractual risks and liabilities
    authority_ceiling: SEV1
  Executive_Sponsor:
    primary: Dr. Patricia Morales, CISO
    backup: Sarah Park, IT Director
    responsibilities:
    - Provides the necessary resources(budget, personnel, technical)
    - Arbitrates priority conflicts between teams or departments
    - Assesses the consequences of the incident on the company's activities
    authority_ceiling: SEV1
  Scribe:
    primary: Mike Torres, Network Engineer
    backup: Robert Kim, Infrastructure Lead
    responsibilities:
     - Maintains a chronological log of events
     - Record decisions, actions taken, and the persons responsible
     - Note the important times, changes in the situation, and the results obtained
    authority_ceiling: SEV4
escalation:
  SEV1:
    on_detection:
     - IR_Commander
     - Technical_Lead
     - Executive_Sponsor
    on_confirmation:
     - Communications_Lead
     - Legal_Liaison
    on_scope_expansion:
     - Executive_Sponsor
     - Legal_Liaison
     - Communications_Lead
    time_threshold_minutes_to_escalate: 15
  SEV2:
    on_detection:
      - IR_Commander
      - Technical_Lead
    on_confirmation:
      - Communications_Lead
      - Legal_Liaison
    on_scope_expansion:
      - Executive_Sponsor
    time_threshold_minutes_to_escalate: 30
  SEV3:
    on_detection:
    - Technical_Lead
    on_confirmation:
    - IR_Commander
    on_scope_expansion:
    - Executive_Sponsor
    - Legal_Liaison
    time_threshold_minutes_to_escalate: 60
  SEV4:
    on_detection:
    - Technical_Lead
    on_confirmation:
    - IR_Commander
    on_scope_expansion:
    - Technical_Lead
    - IR_Commander
    time_threshold_minutes_to_escalate: 240