roles:
  IR_Commander:
    primary: "James Chen, SOC Lead / IR Commander"
    backup: "Sarah Park, IT Director"
    responsibilities:
      - "Owns incident response through closure and runs the incident bridge."
      - "Coordinates incident status, decisions, and escalation."
      - "Authorizes response actions within delegated authority."
    authority_ceiling: SEV2

  Technical_Lead:
    primary: "Robert Kim, Infrastructure Lead"
    backup: "Mike Torres, Network Engineer"
    responsibilities:
      - "Coordinates technical response across infrastructure, network, identity, and endpoint teams."
      - "Leads technical containment, eradication, and recovery activities."
      - "Reports technical findings, impact, and scope changes to the IR Commander."
    authority_ceiling: SEV3

  Communications_Lead:
    primary: "Marcus Webb, Communications Director"
    backup: "Sarah Park, IT Director"
    responsibilities:
      - "Prepares internal and external incident communications."
      - "Coordinates communication approvals with the IR Commander and Legal Liaison."
      - "Ensures communications are accurate, consistent, and appropriately authorized."
    authority_ceiling: SEV3

  Legal_Liaison:
    primary: "Helena Reyes, General Counsel"
    backup: "Dr. Patricia Morales, CISO"
    responsibilities:
      - "Assesses legal, regulatory, contractual, and breach notification obligations."
      - "Coordinates evidence preservation and litigation holds."
      - "Advises on HIPAA and applicable state privacy requirements."
    authority_ceiling: SEV2

  Executive_Sponsor:
    primary: "Dr. Patricia Morales, CISO"
    backup: "Sarah Park, IT Director"
    responsibilities:
      - "Exercises executive decision authority for SEV1 incidents."
      - "Allocates resources and resolves cross-department priority conflicts."
      - "Oversees patient safety, organizational impact, and executive reporting."
    authority_ceiling: SEV1

  Scribe:
    primary: "Mike Torres, Network Engineer"
    backup: "Robert Kim, Infrastructure Lead"
    responsibilities:
      - "Maintains a chronological incident log with timestamps."
      - "Records decisions, actions, owners, and supporting evidence."
      - "Documents status changes, escalation events, and outcomes."
    authority_ceiling: SEV4

escalation:
  SEV1:
    on_detection:
      - IR_Commander
      - Technical_Lead
      - Executive_Sponsor
      - Legal_Liaison
      - Scribe
    on_confirmation:
      - Communications_Lead
      - Legal_Liaison
      - Executive_Sponsor
    on_scope_expansion:
      - IR_Commander
      - Technical_Lead
      - Executive_Sponsor
      - Legal_Liaison
      - Communications_Lead
      - Scribe
    time_threshold_minutes_to_escalate: 15

  SEV2:
    on_detection:
      - IR_Commander
      - Technical_Lead
      - Scribe
    on_confirmation:
      - Legal_Liaison
      - Communications_Lead
    on_scope_expansion:
      - Executive_Sponsor
      - Legal_Liaison
      - IR_Commander
      - Technical_Lead
    time_threshold_minutes_to_escalate: 30

  SEV3:
    on_detection:
      - Technical_Lead
      - Scribe
    on_confirmation:
      - IR_Commander
      - Technical_Lead
    on_scope_expansion:
      - IR_Commander
      - Legal_Liaison
      - Executive_Sponsor
    time_threshold_minutes_to_escalate: 60

  SEV4:
    on_detection:
      - Technical_Lead
      - Scribe
    on_confirmation:
      - IR_Commander
    on_scope_expansion:
      - Technical_Lead
      - IR_Commander
    time_threshold_minutes_to_escalate: 240