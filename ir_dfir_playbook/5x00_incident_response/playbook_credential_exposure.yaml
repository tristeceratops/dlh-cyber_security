playbook_id: PB-CREDENTIAL-001
title: MedDefense Credential Exposure Response
owner_role: IR_Commander

applies_to:
  triggers:
    - "Splunk alert for suspicious authentication against meddefense.local or Azure AD."
    - "Azure AD sign-in alert for anomalous location, unfamiliar device, repeated MFA prompts, or suspected token theft."
    - "Wazuh EDR or Microsoft Defender alert indicating credential theft or unauthorized account access."
    - "User report of unexpected MFA approval requests, suspected phishing, or unauthorized account activity."
    - "Evidence of unauthorized VPN access or suspicious access to Epic at epic.meddefense.local."
  indicators:
    - "Successful authentication from an unusual IP address, location, device, or time."
    - "Repeated failed logins followed by a successful login."
    - "Unexpected Azure AD session, refresh-token use, or MFA device registration."
    - "Unauthorized VPN authentication or unexpected VPN session activity."
    - "Unusual Epic access, including access to patient records outside the user's normal duties."
    - "Evidence of mailbox rule changes, suspicious email forwarding, or unauthorized mailbox access."

severity_mapping:
  initial: SEV2
  escalate_if:
    - "Escalate to SEV1 if the incident creates high patient safety impact, confirmed broad ePHI exposure, or a full outage of clinical services."
    - "Escalate to SEV1 if compromised credentials are used to disrupt clinical systems across multiple sites or interfere with active patient care."
    - "Escalate to SEV2 if a previously lower-severity incident confirms compromise of a clinical-access account or malware on a clinical workstation."
    - "Maintain or raise to SEV2 when credential compromise is confirmed and the affected account can access clinical systems or patient records."
    - "Escalate when evidence shows additional compromised accounts, unauthorized privilege escalation, or access beyond the initial scope."
    - "The IR_Commander reviews severity at every status update. Severity decreases only after confirmed containment and IR_Commander approval."
    - "Apply the MedDefense severity matrix: SEV1 decision authority is the CISO, SEV2 is the IR_Commander, SEV3 is the SOC Lead, and SEV4 is the SOC Analyst."

immediate_actions:
  - step: "Declare the suspected credential exposure, record the detection time and reporting source, open the incident record, and assign a unique incident ID."
    owner: IR_Commander
    timebox_minutes: 2
  - step: "Identify the affected account, account owner, account type, privilege level, clinical responsibilities, and known access to Epic, Azure AD, Active Directory, VPN, and email."
    owner: Technical_Lead
    timebox_minutes: 5
  - step: "Determine the suspected exposure window, last known legitimate activity, suspicious source IPs, affected endpoints, and whether the account has privileged access."
    owner: Technical_Lead
    timebox_minutes: 10
  - step: "Preserve the required authentication, Azure AD, mailbox, and data-access audit evidence before executing password resets, session revocation, MFA resets, VPN token revocation, or Epic session termination, unless an immediate patient safety threat requires emergency containment."
    owner: Technical_Lead
    timebox_minutes: 10
  - step: "Assess whether the account is used for patient care and whether suspicious activity could affect active clinical workflows. Notify the IR_Commander immediately if patient safety may be at risk."
    owner: IR_Commander
    timebox_minutes: 10
  - step: "Notify the Legal_Liaison when compromise is suspected to involve ePHI, and initiate the HIPAA assessment as soon as relevant access evidence is available."
    owner: Legal_Liaison
    timebox_minutes: 15

containment_actions:
  - step: "Reset the affected user's password in Active Directory (meddefense.local) and verify synchronization to Azure AD where applicable."
    owner: Technical_Lead
    decision_point: "Preserve authentication logs first unless immediate containment is necessary to protect patient safety or prevent ongoing compromise."
    trade_off: "Stops reuse of the exposed password but may disrupt legitimate access and does not automatically terminate existing sessions."

  - step: "Revoke the affected user's Azure AD sessions and refresh tokens using approved identity administration controls. Verify the revocation request and check for remaining active application sessions."
    owner: Technical_Lead
    decision_point: "Revoke immediately when compromise is confirmed, privileged access is involved, or continued access could expose ePHI."
    trade_off: "Reduces continued access through revocable sessions but may interrupt legitimate access, and some existing access tokens may remain valid until expiry."

  - step: "Reset the affected user's MFA devices and authentication methods. Remove unauthorized registrations and verify the user's identity before registering a trusted method."
    owner: Technical_Lead
    decision_point: "Prioritize immediate reset if an attacker may control an MFA device or has registered an unauthorized authentication method."
    trade_off: "Restores trust in authentication factors but may temporarily lock out the legitimate user."

  - step: "Revoke the affected user's VPN tokens or credentials and terminate active VPN sessions through the approved VPN administration interface."
    owner: Technical_Lead
    decision_point: "Perform when VPN access is confirmed or reasonably suspected, or when VPN access provides a path to affected systems."
    trade_off: "Restricts unauthorized remote access but may interrupt legitimate remote work and does not eliminate other internal access paths."

  - step: "Terminate active Epic sessions associated with the affected account using authorized application administration procedures. Coordinate with the clinical application owner to maintain safe patient-care access."
    owner: Technical_Lead
    decision_point: "Terminate immediately when unauthorized patient-record access is suspected or observed. Do not delay emergency action to protect evidence if patient safety is at risk."
    trade_off: "Stops activity in terminated sessions but may disrupt clinical workflows and does not guarantee that every token or separate session is invalidated."

  - step: "Decision point: choose immediate reset and session revocation or a brief, explicitly authorized monitoring period. Record the decision, approver, start time, deadline, and rationale. Default to immediate containment for confirmed compromise or material patient-safety or ePHI risk."
    owner: IR_Commander
    decision_point: "Monitoring requires documented approval, active monitoring, a defined deadline, and a clear containment trigger. End monitoring immediately if additional compromise or patient-safety risk emerges."
    trade_off: "Immediate containment reduces continued attacker access but sacrifices some attacker-session visibility. Brief monitoring may reveal attacker behavior but risks additional compromise and ePHI exposure."

eradication_actions:
  - "Remove unauthorized Active Directory and Azure AD group memberships, privilege assignments, account changes, and authentication methods after preserving relevant audit evidence."
  - "Remove unauthorized mailbox forwarding rules, inbox rules, delegated permissions, and other persistence after exporting relevant mailbox evidence."
  - "Remove identified credential-stealing malware, malicious browser extensions, and unauthorized remote-access tools from affected endpoints using approved endpoint security procedures."
  - "Rotate additional exposed credentials, privileged credentials, service-account secrets, and API keys when evidence indicates compromise."
  - "Review and remediate unauthorized OAuth grants, enterprise application permissions, and identity persistence where applicable."
  - "Verify that the exposed password is rejected and identified unauthorized access mechanisms have been removed."

recovery_validation:
  - check: "Active Directory and Azure AD authentication."
    criterion: "The legitimate user can authenticate with the replacement password and trusted MFA method, the exposed password is rejected, and no unexplained successful sign-ins remain during the defined observation period."

  - check: "Azure AD session revocation."
    criterion: "Revocation requests are recorded, affected application sessions are checked, known token limitations are documented, and no unexplained authentication activity is observed."

  - check: "MFA and VPN access."
    criterion: "Unauthorized MFA methods and VPN sessions are removed, revoked credentials no longer permit access, and legitimate access is restored through approved authentication."

  - check: "Epic session and clinical workflow."
    criterion: "Unauthorized sessions are terminated, access is limited to authorized users, and the clinical application owner confirms essential patient-care workflows function safely."

  - check: "Mailbox and identity persistence."
    criterion: "Unauthorized forwarding, delegated access, application grants, and privilege changes identified during investigation have been removed or documented as accepted residual risk."

  - check: "Endpoint and security monitoring."
    criterion: "Affected endpoints are cleared or rebuilt as required, and SIEM, EDR, identity, and network monitoring show no unexplained evidence of continued compromise during the defined observation period."

  - check: "HIPAA and ePHI access assessment."
    criterion: "The assessment documents whether ePHI was accessible from the compromised account during the exposure window, the records or categories potentially accessed, the supporting evidence, and any remaining uncertainty. The Legal_Liaison documents applicable breach assessment and notification obligations."

  - check: "Incident closure."
    criterion: "The IR_Commander confirms containment and recovery, documents residual risks, verifies required stakeholder notifications, and approves any severity reduction."

communication_plan:
  - audience: "IR_Commander"
    trigger: "Immediately when the incident is declared and whenever a material finding, containment decision, or severity change occurs."
    template: "templates/incident_status_update.md"

  - audience: "Technical_Lead and SOC"
    trigger: "Immediately after declaration, including the affected account, detection source, suspected exposure window, and evidence collection requirements."
    template: "templates/technical_response_handoff.md"

  - audience: "Legal_Liaison"
    trigger: "When compromise may involve ePHI, patient records, unauthorized disclosure, or regulatory or contractual obligations."
    template: "templates/hipaa_breach_assessment.md"

  - audience: "Executive_Sponsor (CISO)"
    trigger: "Immediately for SEV1, or when a SEV2 incident materially affects clinical access, patient safety, or ePHI exposure risk."
    template: "templates/executive_incident_brief.md"

  - audience: "Communications_Lead"
    trigger: "When workforce, patient, partner, public, or regulatory communications may be needed. Coordinate release with Legal_Liaison and authorized leadership."
    template: "templates/incident_communications_plan.md"

  - audience: "Affected user and clinical application owner"
    trigger: "When password reset, MFA re-registration, VPN revocation, or Epic session termination affects access."
    template: "templates/affected_user_notification.md"

  - audience: "Privacy and compliance stakeholders"
    trigger: "When the ePHI assessment identifies a potential reportable breach or Legal_Liaison determines that further assessment or notification is required."
    template: "templates/privacy_incident_notification.md"

escalation_triggers:
  - "Escalate to SEV1 if high patient-safety impact, confirmed broad ePHI exposure, or a full clinical-service outage occurs."
  - "Escalate if compromised credentials disrupt Epic, LIS-WSIDE-01, or other essential clinical services and threaten patient care."
  - "Escalate when evidence identifies additional compromised accounts, unauthorized privilege escalation, multiple affected sites, or broader unauthorized patient-record access."
  - "Notify Legal_Liaison when ePHI may have been accessible from the compromised account during the exposure window. Document the evidence reviewed, access findings, and uncertainty."
  - "Notify Executive_Sponsor for SEV1 incidents and material scope expansion. The CISO retains SEV1 decision authority."
  - "Escalate one severity level if the incident makes no meaningful progress within the applicable MedDefense threshold: SEV1 15 minutes, SEV2 30 minutes, SEV3 60 minutes, or SEV4 240 minutes."
  - "Reassess severity at every status update. Reduce severity only after confirmed containment and IR_Commander approval."

post_incident_tasks:
  - "Transfer the incident timeline, authentication logs, Azure AD sign-in exports, mailbox exports, data-access audit exports, hashes, and chain-of-custody records to the post-incident review owner."
  - "Document the exposure window, suspected entry method, affected accounts and systems, attacker activity, containment decisions, and any authorized monitoring period."
  - "Complete the HIPAA assessment: determine whether ePHI was accessible from the compromised account during the exposure window, document the evidence and findings, and record Legal_Liaison's notification assessment."
  - "Review the timing and effectiveness of Active Directory password reset, Azure AD session revocation, MFA reset, VPN token revocation, and Epic session termination."
  - "Identify root cause and assign corrective actions with owners and deadlines."
  - "Improve detection rules and monitoring for suspicious authentication, token use, MFA changes, mailbox persistence, and unauthorized Epic access."
  - "Conduct a lessons-learned review with the IR_Commander, Technical_Lead, Legal_Liaison, and relevant stakeholders, and track corrective actions to completion."