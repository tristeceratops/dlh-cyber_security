title: Windows Privileged Logon During Off-Hours
id: 4e8a21d7-5c63-4f92-a1b6-73d9c0e54f28
status: experimental

description: >
  Detects privileged Windows logons occurring during off-hours (18:00 through
  05:59). The data source is Windows Security authentication events, using
  event_id 4624 for successful logons and event_id 4672 for special privileged
  logon assignments. The custom hour_of_day field is a runner-computed
  extension representing the local hour of the event at execution time.
  Off-hours privileged access is meaningful in a healthcare environment because
  unexpected administrative access to systems containing clinical or sensitive
  patient data can indicate compromised credentials or unauthorized activity.
  The SOC should validate the account, source host, destination system, and
  business justification, and investigate or contain the activity when
  unauthorized.

logsource:
  product: windows
  service: security

detection:
  selection:
    event_id:
      - 4624
      - 4672
    LogonType:
      - '3'
      - '10'

  offhours:
    hour_of_day:
      - 18
      - 19
      - 20
      - 21
      - 22
      - 23
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5

  condition: selection and offhours

level: medium

tags:
  - attack.initial_access
  - attack.t1078

falsepositives:
- >
  Legitimate after-hours support shifts where authorized administrators need
  to access Windows systems outside normal business hours.
- >
  Scheduled administrative jobs or automated maintenance tasks that perform
  privileged Windows logons during the off-hours window.
