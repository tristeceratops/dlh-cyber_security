title: Reconnaissance Tool Execution Outside Process Baseline
id: b51e72c6-94a3-4d08-a381-6f29e5c74012
status: experimental

description: >
  Detects execution of common Windows and Linux reconnaissance tools when the
  process was not observed in the approved process baseline. The detection
  uses the runner-computed custom field baseline_seen, derived from
  $BASELINE_PKG/baselines/baseline_process.json. The monitored tools are based
  on anomalies identified in the 3x01 anomaly report. Unexpected execution of
  these utilities may indicate host discovery, account discovery, system
  discovery, or network reconnaissance. The SOC should validate the user,
  host, command line, and business justification.

logsource:
  category: process_creation

detection:
  selection_windows:
    product: windows
    Image:
      - whoami.exe
      - net.exe
      - systeminfo.exe
      - tasklist.exe
      - netstat.exe
    baseline_seen: false

  selection_linux:
    product: linux
    Image:
      - nmap
    baseline_seen: false

  condition: selection_windows or selection_linux

level: medium

tags:
  - attack.discovery
  - attack.t1087
  - attack.t1082

falsepositives:
  - >
    Legitimate MedDefense administrators may use built-in Windows or Linux
    reconnaissance utilities during approved troubleshooting or maintenance.
  - >
    Endpoint-management, vulnerability-management, or monitoring tools may
    execute discovery commands that are absent from the local process baseline.
  - >
    Authorized incident-response, security-testing, or forensic activity may
    intentionally execute these utilities on managed systems.
