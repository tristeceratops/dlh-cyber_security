#!/usr/sbin/nft -f
flush table inet meddefense

table inet meddefense {
    set dmz_net {
        type ipv4_addr
        flags interval
        elements = { 10.10.2.0/24 }
    }

    set internal_net {
        type ipv4_addr
        flags interval
        elements = { 10.10.1.0/24 }
    }

    set mgmt_net {
        type ipv4_addr
        flags interval
        elements = { 192.168.10.0/24 }
    }

    set meddev_net {
        type ipv4_addr
        flags interval
        elements = { 10.10.3.0/24 }
    }

    chain input {
        type filter hook input priority filter; policy drop;
        ct state established,related accept
        iifname "lo" accept
        ip protocol icmp icmp type { echo-request, echo-reply, destination-unreachable, time-exceeded } accept
        ip6 nexthdr icmpv6 accept
        ip saddr @mgmt_net tcp dport 22 accept comment "Administration of internal hosts"
        ip saddr @internal_net tcp dport 443 accept comment "Clinical workstation access to internal application servers"
        ip saddr @internal_net tcp dport 3306 accept comment "Clinical workstation access to internal database servers"
        ip saddr @dmz_net tcp dport 3306 accept comment "DMZ application access to internal databases"
        ip saddr @meddev_net tcp dport 4242 accept comment "DICOM imaging to PACS"
        ip saddr @meddev_net tcp dport 443 accept comment "EHR web integration for device display"
        ip saddr @mgmt_net tcp dport 22 accept comment "Administration of medical devices"
        ip saddr @mgmt_net tcp dport 4242 accept comment "Medical device management using DICOM"
        log prefix "nft-meddefense-input-drop: " flags all
        drop
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
        ct state established,related accept
        ip saddr @mgmt_net ip daddr @internal_net tcp dport 22 accept comment "Administration of internal hosts"
        ip saddr @mgmt_net ip daddr @dmz_net tcp dport 22 accept comment "Administration of DMZ hosts"
        ip saddr @dmz_net ip daddr @internal_net tcp dport 3306 accept comment "DMZ application access to internal databases"
        ip saddr @meddev_net ip daddr @internal_net tcp dport 4242 accept comment "DICOM imaging to PACS"
        ip saddr @meddev_net ip daddr @internal_net tcp dport 443 accept comment "EHR web integration for device display"
        ip saddr @mgmt_net ip daddr @meddev_net tcp dport 22 accept comment "Administration of medical devices"
        ip saddr @mgmt_net ip daddr @meddev_net tcp dport 4242 accept comment "Medical device management using DICOM"
        ip daddr @mgmt_net udp dport 53 accept comment "DNS resolution through management resolver"
        ip daddr @mgmt_net tcp dport 53 accept comment "TCP DNS resolution through management resolver"
        ip saddr @dmz_net ip daddr @meddev_net log prefix "nft-meddefense-deny-DMZ-MEDDEV: " flags all drop comment "No cross-zone flows are authorized"
        ip saddr @internal_net ip daddr @dmz_net log prefix "nft-meddefense-deny-INTERNAL-DMZ: " flags all drop comment "No cross-zone flows are authorized"
        ip saddr @internal_net ip daddr @meddev_net log prefix "nft-meddefense-deny-INTERNAL-MEDDEV: " flags all drop comment "No cross-zone flows are authorized"
        ip saddr @meddev_net ip daddr @dmz_net log prefix "nft-meddefense-deny-MEDDEV-DMZ: " flags all drop comment "No cross-zone flows are authorized"
        log prefix "nft-meddefense-forward-drop: " flags all
        drop
    }

    chain output {
        type filter hook output priority filter; policy accept;
        ct state established,related accept
        oifname "lo" accept
        ip saddr @internal_net ip daddr @meddev_net log prefix "nft-meddefense-output-drop: " flags all drop
        ip saddr @meddev_net ip daddr @dmz_net log prefix "nft-meddefense-output-drop: " flags all drop
        ip saddr @meddev_net ip daddr != @dmz_net ip daddr != @internal_net ip daddr != @mgmt_net ip daddr != @meddev_net log prefix "nft-meddefense-output-drop: " flags all drop
    }
}
